name: Apply SUSFS 2.1 + ZeroMount Patches

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch_tree:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source Tree
        uses: actions/checkout@v4
        with:
          ref: lineage-23.2
          fetch-depth: 1

      - name: Clone and Apply Amazeble SUSFS-NonGKI-Patches
        run: |
          set -euo pipefail
          echo "[+] Cloning Amazeble/SUSFS-NonGKI-Patches..."
          git clone https://github.com/Amazeble/SUSFS-NonGKI-Patches /tmp/susfs-nongki
          
          echo "[+] Applying patches to kernel source at $GITHUB_WORKSPACE..."
          cd /tmp/susfs-nongki
          ./apply_patches.sh "$GITHUB_WORKSPACE"
          
          echo "[+] Patches applied. Returning to kernel source."
          cd "$GITHUB_WORKSPACE"
          rm -rf /tmp/susfs-nongki

      - name: Commit and Push Patched Kernel
        run: |
          set -euo pipefail
          
          # Remove any nested .git directories to avoid submodule issues
          find . -mindepth 2 -name ".git" -type d -exec rm -rf {} + 2>/dev/null || true
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add -A
          git commit -m "Apply SUSFS 2.1 + ZeroMount patches from Amazeble/SUSFS-NonGKI-Patches" || echo "No changes to commit"
          git push origin lineage-23.2
