name: Build Xiaomi Surya Kernel (NetHunter + KSU)

on:
  workflow_dispatch: # Allows manual triggering from the Actions tab
  push:
    branches: [ "lineage-23.2" ]
  pull_request:
    branches: [ "lineage-23.2" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # Ensures KernelSU and other submodules are cloned

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            lld \
            llvm \
            bc \
            bison \
            flex \
            libssl-dev \
            make \
            python3 \
            dos2unix \
            git

      - name: Fix Kernel Tree Issues (CRLF & Missing Files)
        run: |
          set -euo pipefail
          echo "::group::Fixing line endings and missing Kconfigs"

          # 1. Fix Windows CRLF line endings in KernelSU and all Kconfig files
          # This resolves the "ignoring unsupported character '\r'" warnings
          echo "Normalizing CRLF to LF..."
          find . -path ./.git -prune -o -type f \( -name 'Kconfig*' -o -name 'Makefile*' \) -print0 | xargs -0 sed -i 's/\r$//' || true
          
          # Specifically target KernelSU if it's a submodule or directory
          if [ -d "drivers/kernelsu" ]; then
            find drivers/kernelsu -type f \( -name '*.c' -o -name '*.h' -o -name 'Kconfig*' -o -name 'Makefile*' \) -exec sed -i 's/\r$//' {} + || true
            # Remove UTF-8 BOM if present
            find drivers/kernelsu -type f -name 'Kconfig*' -exec sed -i '1s/^\xEF\xBB\xBF//' {} + || true
          fi

          # 2. Handle missing fs/nomount/Kconfig
          # If fs/Kconfig references it but the file doesn't exist, create an empty stub
          # so the Kconfig parser doesn't throw a fatal Error 1.
          if [ -f "fs/Kconfig" ]; then
            if grep -q "source \"fs/nomount/Kconfig\"" fs/Kconfig; then
              if [ ! -f "fs/nomount/Kconfig" ]; then
                echo "WARNING: fs/nomount/Kconfig is missing! Creating stub to prevent build failure."
                mkdir -p fs/nomount
                printf '# Stub file created by CI to satisfy fs/Kconfig source inclusion\n' > fs/nomount/Kconfig
                printf '# CONFIG_NOMOUNT feature will NOT function without actual source code.\n' >> fs/nomount/Kconfig
              fi
            fi
          else
            echo "::error::fs/Kconfig is completely missing from the source tree!"
            exit 1
          fi

          echo "::endgroup::"

      - name: Setup Output Directory
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out

      - name: Generate Base Defconfig
        run: |
          set -euo pipefail
          echo "::group::Running surya_defconfig"
          # Note: LLVM=1 automatically sets CC=clang in modern kernels, 
          # but we keep CC=clang as requested.
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 surya_defconfig
          echo "::endgroup::"

      - name: Apply Custom Configurations
        run: |
          set -euo pipefail
          echo "::group::Applying scripts/config modifications"

          # --- KSU & SUSFS ---
          ./scripts/config --file out/.config --enable CONFIG_KSU
          ./scripts/config --file out/.config --enable CONFIG_KSU_MANUAL_HOOK
          ./scripts/config --file out/.config --enable CONFIG_KALLSYMS
          ./scripts/config --file out/.config --enable CONFIG_KALLSYMS_ALL
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_PATH
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_MOUNT
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_KSTAT
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SPOOF_UNAME
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_ENABLE_LOG
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_OPEN_REDIRECT
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_MAP
          ./scripts/config --file out/.config --enable CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK
          ./scripts/config --file out/.config --enable CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK

          # --- System & FS ---
          ./scripts/config --file out/.config --enable CONFIG_SYSCTL
          ./scripts/config --file out/.config --enable CONFIG_SYSVIPC
          ./scripts/config --file out/.config --enable CONFIG_POSIX_MQUEUE
          ./scripts/config --file out/.config --enable CONFIG_KPM
          ./scripts/config --file out/.config --enable CONFIG_EXT4_FS
          ./scripts/config --file out/.config --enable CONFIG_OVERLAY_FS
          ./scripts/config --file out/.config --enable CONFIG_PACKET
          
          # IMPORTANT: Do NOT enable CONFIG_NOMOUNT here unless you have the actual 
          # fs/nomount/*.c source code. Enabling it with just a stub Kconfig will 
          # cause compilation errors later. We leave it disabled.
          # ./scripts/config --file out/.config --enable CONFIG_NOMOUNT

          # --- Modules Support ---
          ./scripts/config --file out/.config --enable CONFIG_MODULES
          ./scripts/config --file out/.config --enable CONFIG_MODULE_UNLOAD

          # --- Disable KPROBES (Required for KSU Manual Hook) ---
          ./scripts/config --file out/.config --disable CONFIG_KPROBES

          # --- USB Gadget ---
          ./scripts/config --file out/.config --module CONFIG_USB_GADGET
          ./scripts/config --file out/.config --enable CONFIG_USB_LIBCOMPOSITE
          ./scripts/config --file out/.config --enable CONFIG_USB_F_FS
          ./scripts/config --file out/.config --enable CONFIG_USB_F_RNDIS
          ./scripts/config --file out/.config --enable CONFIG_USB_F_MASS_STORAGE
          ./scripts/config --file out/.config --enable CONFIG_USB_F_HID

          # --- Bluetooth ---
          ./scripts/config --file out/.config --enable CONFIG_BT
          ./scripts/config --file out/.config --module CONFIG_BT_HCIBTUSB
          ./scripts/config --file out/.config --module CONFIG_BT_HCIBTUSB_BCM
          ./scripts/config --file out/.config --module CONFIG_BT_HCIBTUSB_RTL
          ./scripts/config --file out/.config --module CONFIG_BT_HCIBTUSB_MTK

          # --- Wi-Fi (RTW88 NetHunter) ---
          ./scripts/config --file out/.config --enable CONFIG_CFG80211
          ./scripts/config --file out/.config --enable CONFIG_MAC80211
          ./scripts/config --file out/.config --enable CONFIG_RTW88
          ./scripts/config --file out/.config --enable CONFIG_RTW88_CORE
          ./scripts/config --file out/.config --enable CONFIG_RTW88_USB
          ./scripts/config --file out/.config --enable CONFIG_RTW88_8812A
          ./scripts/config --file out/.config --module CONFIG_RTW88_8812AU

          echo "::endgroup::"

      - name: Finalize Configuration (olddefconfig)
        run: |
          set -euo pipefail
          echo "::group::Running olddefconfig"
          # This resolves dependencies, drops invalid configs, and finalizes .config
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 olddefconfig
          echo "::endgroup::"

      - name: Verify Critical Configs
        run: |
          set -euo pipefail
          echo "::group::Verifying .config"
          echo "Checking if critical options survived olddefconfig..."
          
          check_config() {
            if grep -q "$1=y" out/.config || grep -q "$1=m" out/.config; then
              echo "✅ $1 is enabled"
            else
              echo "⚠️ WARNING: $1 was dropped or disabled by dependency resolution!"
            fi
          }

          check_config "CONFIG_KSU"
          check_config "CONFIG_KSU_SUSFS"
          check_config "CONFIG_KSU_MANUAL_HOOK"
          check_config "CONFIG_RTW88_8812AU"
          
          if grep -q "# CONFIG_KPROBES is not set" out/.config; then
            echo "✅ CONFIG_KPROBES is successfully disabled"
          else
            echo "⚠️ WARNING: CONFIG_KPROBES might still be enabled!"
          fi
          
          echo "::endgroup::"

      - name: Build Kernel Image
        run: |
          set -euo pipefail
          echo "::group::Compiling Kernel"
          # Replace 'Image.gz-dtb' with whatever your specific device requires
          # Common targets: Image, Image.gz, Image.gz-dtb, dtbs
          make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 Image.gz-dtb
          echo "::endgroup::"

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: surya-kernel-nethunter-ksu
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dts/**/*.dtb
          retention-days: 7