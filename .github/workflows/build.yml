name: ELISE KERNEL

on:
  push:
    branches: [ lineage-23.2 ]
  pull_request:
    branches: [ lineage-23.2 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          # Added coccinelle for 'spatch' required by Droidspaces action.yml
          sudo apt-get install -y bc bison build-essential cpio flex git gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libelf-dev zip python3 rsync dwarves coccinelle

      - name: Setup AOSP Clang Toolchain
        run: |
          TC_DIR="$(pwd)/tc/clang-498229"
          if [ ! -d "$TC_DIR" ]; then
            GITLAB_HOST="https://gitlab.com"
            TC_PATH="/ThankYouMario/android_prebuilts_clang-standalone"
            git clone --depth=1 -b 17 "${GITLAB_HOST}${TC_PATH}" "$TC_DIR"
          fi
          echo "$TC_DIR/bin" >> $GITHUB_PATH

      - name: Vendor in rtw88 (RTL8812AU) driver from NetHunter tree
        run: |
          GIT_HOST="https://github.com"
          DRIVER_PATH="/akabul0us/android_kernel_xiaomi_surya_nethunter.git"
          git clone --depth=1 --branch rebase-2-electric-boogaloo "${GIT_HOST}${DRIVER_PATH}" /tmp/nethunter
          
          mkdir -p drivers/net/wireless/realtek
          cp -r /tmp/nethunter/drivers/net/wireless/realtek/rtw88 drivers/net/wireless/realtek/rtw88
          rm -rf /tmp/nethunter
          
          # Apply critical patches to rtw88 driver
          find drivers/net/wireless/realtek/rtw88 -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/NL80211_SCAN_FLAG_RANDOM_SN/NL80211_SCAN_FLAG_RANDOM_ADDR/g' {} +
          find drivers/net/wireless/realtek/rtw88 -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/RX_FLAG_NO_PSDU/0/g' {} +
          
          # Verify patches were applied
          if grep -r 'NL80211_SCAN_FLAG_RANDOM_SN' drivers/net/wireless/realtek/rtw88 > /dev/null; then
            echo "WARNING: SN NOT PATCHED"
            exit 1
          else
            echo "SN PATCHED OK"
          fi
          
          if grep -r 'RX_FLAG_NO_PSDU' drivers/net/wireless/realtek/rtw88 > /dev/null; then
            echo "WARNING: PSDU NOT PATCHED"
            exit 1
          else
            echo "PSDU PATCHED OK"
          fi
          
          # Add Kconfig and Makefile entries
          grep -q 'realtek/rtw88/Kconfig' drivers/net/wireless/realtek/Kconfig || \
            sed -i '/source "drivers\/net\/wireless\/realtek\/rtl8xxxu\/Kconfig"/a source "drivers/net/wireless/realtek/rtw88/Kconfig"' drivers/net/wireless/realtek/Kconfig
          grep -q 'CONFIG_RTW88' drivers/net/wireless/realtek/Makefile || \
            echo 'obj-$(CONFIG_RTW88) += rtw88/' >> drivers/net/wireless/realtek/Makefile
 
      - name: Generate & Force Feature Defconfig
        run: |
          mkdir -p out
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 surya_defconfig
          
          # --- KSU & SUSFS ---
          ./scripts/config --file out/.config --enable CONFIG_KSU
          ./scripts/config --file out/.config --enable CONFIG_KSU_MANUAL_HOOK
          ./scripts/config --file out/.config --enable CONFIG_KALLSYMS
          ./scripts/config --file out/.config --enable CONFIG_KALLSYMS_ALL
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_PATH
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_MOUNT
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_KSTAT
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SPOOF_UNAME
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_ENABLE_LOG
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_OPEN_REDIRECT
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_MAP
          ./scripts/config --file out/.config --enable CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK
          ./scripts/config --file out/.config --enable CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK
          
          # --- System & FS ---
          ./scripts/config --file out/.config --enable CONFIG_SYSCTL
          ./scripts/config --file out/.config --enable CONFIG_SYSVIPC
          ./scripts/config --file out/.config --enable CONFIG_POSIX_MQUEUE
          ./scripts/config --file out/.config --enable CONFIG_KPM
          ./scripts/config --file out/.config --enable CONFIG_EXT4_FS
          ./scripts/config --file out/.config --enable CONFIG_OVERLAY_FS
          ./scripts/config --file out/.config --enable CONFIG_PACKET
          ./scripts/config --file out/.config --enable CONFIG_NOMOUNT
          
          # --- Modules Support (Required for =m configs) ---
          ./scripts/config --file out/.config --enable CONFIG_MODULES
          ./scripts/config --file out/.config --enable CONFIG_MODULE_UNLOAD
          
          # --- IMPORTANT: Disable KPROBES ---
          ./scripts/config --file out/.config --disable CONFIG_KPROBES
          
          # --- USB ---
          ./scripts/config --file out/.config --module CONFIG_USB_GADGET
          ./scripts/config --file out/.config --enable CONFIG_USB_LIBCOMPOSITE
          ./scripts/config --file out/.config --enable CONFIG_USB_F_FS
          ./scripts/config --file out/.config --enable CONFIG_USB_F_RNDIS
          ./scripts/config --file out/.config --enable CONFIG_USB_F_MASS_STORAGE
          ./scripts/config --file out/.config --enable CONFIG_USB_F_HID
          
          # --- Bluetooth ---
          ./scripts/config --file out/.config --enable CONFIG_BT
          ./scripts/config --file out/.config --module CONFIG_BT_HCIBTUSB
          ./scripts/config --file out/.config --module CONFIG_BT_HCIBTUSB_BCM
          ./scripts/config --file out/.config --module CONFIG_BT_HCIBTUSB_RTL
          ./scripts/config --file out/.config --module CONFIG_BT_HCIBTUSB_MTK
          
          # --- Wi-Fi (RTW88 Standard NetHunter) ---
          ./scripts/config --file out/.config --enable CONFIG_CFG80211
          ./scripts/config --file out/.config --enable CONFIG_MAC80211
          ./scripts/config --file out/.config --enable CONFIG_RTW88
          ./scripts/config --file out/.config --enable CONFIG_RTW88_CORE
          ./scripts/config --file out/.config --enable CONFIG_RTW88_USB
          ./scripts/config --file out/.config --enable CONFIG_RTW88_8812A
          ./scripts/config --file out/.config --module CONFIG_RTW88_8812AU
          
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 olddefconfig

      # FIX 1: Removed duplicate dash that caused YAML syntax error
      - name: Build Kernel
        run: |
          # FIX 2: Removed redundant pre-build gzip commands that wasted CI time
          make -j$(nproc --all) O=out ARCH=arm64 \
          KCFLAGS="-Wno-error -Wno-error=implicit-function-declaration -Wno-error=strict-prototypes -DRX_FLAG_NO_PSDU=0 -DNL80211_SCAN_FLAG_RANDOM_SN=0" \
          CC=clang LD=ld.lld AS=llvm-as AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
          CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
          LLVM=1 LLVM_IAS=1 \
          Image.gz dtb.img dtbo.img modules 2> >(tee log.txt >&2) || exit $?

      - name: Compile WFB-ng RTL8812AU Driver (Out-of-Tree)
        run: |
          # Clone the specialized WFB-ng driver
          git clone -b v5.2.20 https://github.com/svpcom/rtl8812au.git /tmp/rtl8812au_wfb
          
          # Compile it against your kernel build directory
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          M=/tmp/rtl8812au_wfb modules
          
          # Rename it so it doesn't overwrite the NetHunter one
          if [ -f "/tmp/rtl8812au_wfb/8812au.ko" ]; then
            mv /tmp/rtl8812au_wfb/8812au.ko /tmp/rtl8812au_wfb/8812au_wfb.ko
            echo "WFB-ng driver compiled successfully."
          else
            echo "WARNING: WFB-ng driver failed to compile!"
          fi
          
      - name: Embed APatch Core into Output Kernel Binary
        env:
          KP_SECURE_KEY: ${{ secrets.KP_SECURE_KEY }}
        run: |
          # 1. Pull the latest release tag from the official KernelPatch API
          KP_VERSION=$(curl -s https://api.github.com/repos/bmax121/KernelPatch/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Using KernelPatch Version: $KP_VERSION"
          
          # 2. Download the standalone binaries directly from the release assets
          mkdir -p ./apatch-tools
          curl -Lo ./apatch-tools/kptools "https://github.com/bmax121/KernelPatch/releases/download/${KP_VERSION}/kptools-linux"
          curl -Lo ./apatch-tools/kpimg-android "https://github.com/bmax121/KernelPatch/releases/download/${KP_VERSION}/kpimg-android"
          chmod +x ./apatch-tools/kptools
          
          # 3. Decompress Image.gz because kptools requires an uncompressed kernel image to patch
          # FIX 3: Added rm -f and -df flag to prevent "already exists; not overwritten" error
          if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            rm -f out/arch/arm64/boot/Image
            gzip -df out/arch/arm64/boot/Image.gz
          fi
          
          # 4. Inject APatch engine hooks using the correct CLI arguments
          ./apatch-tools/kptools -p \
            --image out/arch/arm64/boot/Image \
            --out out/arch/arm64/boot/Image-patched \
            --skey "${KP_SECURE_KEY}" \
            --kpimg ./apatch-tools/kpimg-android
            
          # 5. Replace the original image and compress it back to Image.gz for AnyKernel3
          mv out/arch/arm64/boot/Image-patched out/arch/arm64/boot/Image
          # FIX 4: Added -f flag to prevent gzip overwrite failure on repack
          gzip -f out/arch/arm64/boot/Image
          
          echo "EMBED SUCCESSFUL: Official APatch runtime engine hooks hard-baked into Image.gz."

      - name: Package AnyKernel3 ZIP
        run: |
          export ZIPNAME="Arise-surya-$(date '+%Y%m%d-%H%M').zip"
          head=$(git rev-parse --verify HEAD 2>/dev/null)
          if [ -n "$head" ]; then
            ZIPNAME="${ZIPNAME::-4}-$(echo $head | cut -c1-8).zip"
          fi
          kernel="out/arch/arm64/boot/Image.gz"
          dtb="out/arch/arm64/boot/dtb.img"
          dtbo="out/arch/arm64/boot/dtbo.img"
          if [ -f "$kernel" ] && [ -f "$dtb" ] && [ -f "$dtbo" ]; then
            GIT_HOST="https://github.com"
            AK3_PATH="/surya-aosp/AnyKernel3"
            if ! git clone -q "${GIT_HOST}${AK3_PATH}" -b arise AnyKernel3; then
              echo "Failed to clone AnyKernel3!"
              exit 1
            fi
            
            cp $kernel $dtb $dtbo AnyKernel3/
            
            mkdir -p AnyKernel3/system/lib/modules
            
            # 1. Copy NetHunter (Standard) Driver
            rtw_mod=$(find out -name 'rtw88_8812au.ko' | head -n1)
            if [ -n "$rtw_mod" ]; then
              cp "$rtw_mod" AnyKernel3/system/lib/modules/
            else
              echo "WARNING: rtw88_8812au.ko not found in build output!"
            fi
            
            # 2. Copy WFB-ng (Drone/Injection) Driver
            wfb_mod=$(find /tmp/rtl8812au_wfb -name '8812au_wfb.ko' | head -n1)
            if [ -n "$wfb_mod" ]; then
              cp "$wfb_mod" AnyKernel3/system/lib/modules/
            else
              echo "WARNING: 8812au_wfb.ko not found!"
            fi

            # FIX 5: Search entire workspace for firmware instead of just out/ directory
            rtw_fw=$(find . -name 'rtw8812a_fw.bin' | head -n1)
            if [ -n "$rtw_fw" ]; then
              mkdir -p AnyKernel3/vendor/firmware/rtw88
              cp "$rtw_fw" AnyKernel3/vendor/firmware/rtw88/
            fi
            
            mkdir -p AnyKernel3/system/etc/init
            printf '%s\n' \
              'on boot' \
              '    insmod /system/lib/modules/rtw88_8812au.ko' \
              '' \
              'on post-fs-data' \
              '    mkdir /config/usb/g1 0770 system system' \
              '    mkdir /config/usb/g1/functions/rndis.gs4 0770 system system' \
              '    mkdir /config/usb/g1/functions/hid.usb0 0770 system system' \
              '    mkdir /config/usb/g1/functions/mass_storage.0 0770 system system' \
              '    write /config/usb/g1/os_desc/use 1' \
              > AnyKernel3/system/etc/init/arise.rc
            
            cd AnyKernel3
            zip -r9 "../$ZIPNAME" * -x .git README.md *placeholder
            cd ..
            echo "Completed in $((SECONDS / 60))m $((SECONDS % 60))s - Zip: $ZIPNAME"
            echo "ZIPNAME=$ZIPNAME" >> $GITHUB_ENV
          else
            echo "Compilation failed!"
            exit 1
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arise-Kernel-Surya
          path: ${{ env.ZIPNAME }}