name: ELISE KERNEL

on:
  push:
    branches: [ main, master, lineage-23.2 ]
  pull_request:
    branches: [ main, master, lineage-23.2 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: 'keyloggerever-pixel/kernel_xiaomi_surya'
          ref: 'lineage-23.2'
          fetch-depth: 0

      # ── 0. AOSP Clang 12 (clang-r416183b) + GCC 4.9 prebuilts ──
      - name: Download AOSP toolchain
        run: |
          mkdir -p $HOME/tc
          curl -Lo clang.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-12.0.0_r1/clang-r416183b.tar.gz"
          mkdir -p $HOME/tc/clang && tar -C $HOME/tc/clang -xzf clang.tar.gz
          curl -Lo gcc64.tar.gz "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.0.0_r1.tar.gz"
          mkdir -p $HOME/tc/gcc-64 && tar -C $HOME/tc/gcc-64 -xzf gcc64.tar.gz
          curl -Lo gcc32.tar.gz "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.0.0_r1.tar.gz"
          mkdir -p $HOME/tc/gcc-32 && tar -C $HOME/tc/gcc-32 -xzf gcc32.tar.gz
          echo "$HOME/tc/clang/bin:$HOME/tc/gcc-64/bin:$HOME/tc/gcc-32/bin" >> $GITHUB_PATH

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev lz4 perl

      # ── 1. clean_hook.sh: wipe old KSU/Next + all SUSFS/KSU hooks ──
      - name: Run clean_hook.sh
        run: |
          chmod +x clean_hook.sh
          ./clean_hook.sh
          # Guard: remove any leftover direct KernelSU-Next path lines in Makefiles
          for f in drivers/Makefile common/drivers/Makefile drivers/Kconfig common/drivers/Kconfig; do
            [ -f "$f" ] && sed -i '/KernelSU-Next/d' "$f"
          done
          true

      # ── 2. Embed ReSukiSU (recreates symlink + keeps Makefile/Kconfig entries) ──
      - name: Setup ReSukiSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: Apply ReSukiSU 4.14 manual hooks
        run: | 
          chmod +x apply_resukisu_4.14.sh && ./apply_resukisu_4.14.sh "$GITHUB_WORKSPACE"

      # ── 3. Apply SUSFS patches (Failures are expected and handled next) ──
      - name: Apply SUSFS patches
        run: |
          git clone https://github.com/Amazeble/SUSFS-NonGKI-Patches.git
          echo "[+] Applying SUSFS patches..."
          for patch in SUSFS-NonGKI-Patches/patches/*.patch; do
              echo "Applying $(basename "$patch")..."
              # Apply what we can, ignore failures
              patch -p1 --fuzz=3 --ignore-whitespace < "$patch" || echo "Warning: $(basename "$patch") had rejections"
          done

      # ── 4. Repair broken syntax and inject missing compat/SUSFS hooks ──
      - name: Fix SUSFS rejections and broken syntax
        run: |
          if [ -f "fix_susfs_rejections.py" ]; then
            echo "[+] Running rejection fixer..."
            python3 fix_susfs_rejections.py
          else
            echo "[-] fix_susfs_rejections.py not found!"
            exit 1
          fi

      - name: Apply SUSFS patches
        run: |
          git clone https://github.com/Amazeble/SUSFS-NonGKI-Patches.git
          echo "[+] Applying SUSFS patches manually..."
          # Loop through all .patch files and apply them to the kernel root
          for patch in SUSFS-NonGKI-Patches/patches/*.patch; do
              echo "Applying $(basename "$patch")..."
              patch -p1 < "$patch" || echo "Warning: $(basename "$patch") failed or already applied."
          done

      # ── 5. Verify that all SUSFS patches and Python repairs actually applied ──
      - name: Verify SUSFS Anchors
        run: |
          echo "[+] Verifying SUSFS patches and Python repairs..."
          FAIL=0

          check_anchor() {
            if grep -q "$2" "$1"; then
              echo "  [+] $1 contains SUSFS anchor"
            else
              echo "  [!] MISSING SUSFS anchor in $1: $2"
              FAIL=1
            fi
          }

          # These are unique strings injected by the SUSFS patches and our Python script
          check_anchor "fs/namei.c" "susfs_fake_qstr_name"
          check_anchor "fs/readdir.c" "susfs_should_hide_dirent"
          check_anchor "kernel/reboot.c" "goto orig_flow;"
          check_anchor "fs/statfs.c" "susfs_get_non_sus_vfsmnt_from_vfsmnt"
          check_anchor "fs/notify/fdinfo.c" "struct mount \*mnt = NULL;"

          if [ "$FAIL" -eq 1 ]; then
            echo "[!] CRITICAL: Some SUSFS patches are missing or Python repair failed."
            echo "[!] Aborting workflow before compile to save time."
            exit 1
          fi
          
          echo "[+] All SUSFS patches verified successfully!"



      # ── 7. Compile specifically for surya with injected configs ──
      - name: Compile kernel
        run: |
          export ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu \
                 CROSS_COMPILE=aarch64-linux-android- \
                 CROSS_COMPILE_ARM32=arm-linux-androideabi-
          
          # Auto-detect kernel version for LLD binutils
          KVER=$(make kernelversion)
          KM=${KVER%%.*}; KN=$(echo "$KVER" | cut -d. -f2)
          echo "[+] Kernel version: $KVER"
          if [ "$KM" -gt 4 ] || { [ "$KM" -eq 4 ] && [ "$KN" -ge 19 ]; }; then
            export LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
                   OBJDUMP=llvm-objdump STRIP=llvm-strip
            echo "[+] Using LLD/LLVM binutils"
          else
            echo "[+] Using GNU ld from CROSS_COMPILE"
          fi

          # Generate base config for Poco M3 / Redmi 9T
          make O=out surya_defconfig
          
          # Inject KSU and KALLSYMS configurations
          echo "[+] Injecting required configurations..."
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> out/.config
          echo "CONFIG_KALLSYMS=y" >> out/.config
          echo "CONFIG_KALLSYMS_ALL=y" >> out/.config
          
          # Optional: If your SUSFS patches require their own Kconfig flags, add them here too:
          # echo "CONFIG_KSU_SUSFS=y" >> out/.config
          # echo "CONFIG_KSU_SUSFS_SUS_SU=y" >> out/.config
          
          # Resolve dependencies and finalize config
          make O=out olddefconfig
          
          # Compile
          echo "[+] Starting compilation..."
          make -j"$(nproc)" O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu-


      - name: Package Kernel into Zip
        run: |
          set -euo pipefail
          BUILD_DATE="$(date +'%Y%m%d')"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          ZIP_NAME="ELISE-Kernel-surya-${BUILD_DATE}-${SHORT_SHA}"
          STAGE="dist/${ZIP_NAME}"
          mkdir -p "${STAGE}/dtbs"

          # --- Kernel image ---
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz "${STAGE}/"
          elif [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image "${STAGE}/"
          else
            echo "::error::No kernel image found!"
            exit 1
          fi

          # --- Device tree blobs ---
          find out/arch/arm64/boot/dts -name "*.dtb" -exec cp {} "${STAGE}/dtbs/" \; || true

          # --- DTBO image (only if your tree builds one) ---
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img "${STAGE}/" || true

          # --- Modules (only if any .ko were built) ---
          if find out/ -name "*.ko" | grep -q .; then
            mkdir -p "${STAGE}/modules"
            find out/ -name "*.ko" -exec cp {} "${STAGE}/modules/" \;
          fi

          # --- Build info ---
          {
            echo "Kernel   : ELISE KERNEL"
            echo "Device   : xiaomi surya"
            echo "Date     : ${BUILD_DATE}"
            echo "Commit   : ${SHORT_SHA}"
            echo "Toolchain: AOSP clang-498229"
            echo "Features : ReSukiSU (manual hooks) + SUSFS 2.1"
          } > "${STAGE}/BUILD_INFO.txt"

          # --- Create the zip ---
          (cd dist && zip -r9 "${ZIP_NAME}.zip" "${ZIP_NAME}")
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          ls -la dist/

      - name: Upload Kernel Zip as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: dist/${{ env.ZIP_NAME }}.zip
          if-no-files-found: error



