name: ELISE KERNEL

on:
  push:
    branches: [ main, master, lineage-23.2 ]
  pull_request:
    branches: [ main, master, lineage-23.2 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio flex git gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libelf-dev zip python3 rsync dwarves

      - name: Setup AOSP Clang Toolchain
        run: |
          set -euo pipefail
          TC_DIR="$(pwd)/tc/clang-498229"
          if [ ! -d "$TC_DIR" ]; then
            GITLAB_HOST="https://gitlab.com"
            TC_PATH="/ThankYouMario/android_prebuilts_clang-standalone"
            git clone --depth=1 -b 17 "${GITLAB_HOST}${TC_PATH}" "$TC_DIR"
          fi
          echo "$TC_DIR/bin" >> $GITHUB_PATH

      - name: Vendor in rtw88 (RTL8812AU) driver from NetHunter tree
        run: |
          set -euo pipefail
          GIT_HOST="https://github.com"
          DRIVER_PATH="/akabul0us/android_kernel_xiaomi_surya_nethunter.git"
          git clone --depth=1 --branch rebase-2-electric-boogaloo "${GIT_HOST}${DRIVER_PATH}" /tmp/nethunter

          mkdir -p drivers/net/wireless/realtek
          cp -r /tmp/nethunter/drivers/net/wireless/realtek/rtw88 drivers/net/wireless/realtek/rtw88
          rm -rf /tmp/nethunter

          find drivers/net/wireless/realtek/rtw88 -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/NL80211_SCAN_FLAG_RANDOM_SN/NL80211_SCAN_FLAG_RANDOM_ADDR/g' {} +
          find drivers/net/wireless/realtek/rtw88 -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/RX_FLAG_NO_PSDU/0/g' {} +

          if grep -r 'NL80211_SCAN_FLAG_RANDOM_SN' drivers/net/wireless/realtek/rtw88 > /dev/null; then
            echo "ERROR: SN NOT PATCHED"
            exit 1
          else
            echo "SN PATCHED OK"
          fi

          if grep -r 'RX_FLAG_NO_PSDU' drivers/net/wireless/realtek/rtw88 > /dev/null; then
            echo "ERROR: PSDU NOT PATCHED"
            exit 1
          else
            echo "PSDU PATCHED OK"
          fi

          grep -q 'realtek/rtw88/Kconfig' drivers/net/wireless/realtek/Kconfig || \
            sed -i '/source "drivers\/net\/wireless\/realtek\/rtl8xxxu\/Kconfig"/a source "drivers/net/wireless/realtek/rtw88/Kconfig"' drivers/net/wireless/realtek/Kconfig
          grep -q 'CONFIG_RTW88' drivers/net/wireless/realtek/Makefile || \
            echo 'obj-$(CONFIG_RTW88) += rtw88/' >> drivers/net/wireless/realtek/Makefile

      - name: Integrate NoMount into Kernel Source
        run: |
          set -euo pipefail
          echo "Integrating NoMount (dev branch) into kernel source..."
          curl -LSs "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh" | bash -s dev
          echo "NoMount integration completed successfully!"

      - name: Apply SUSFS 2.1 + ZeroMount patches (Amazeble)
        run: |
          set -euo pipefail
          echo "[+] Cloning Amazeble/SUSFS-NonGKI-Patches..."
          git clone https://github.com/Amazeble/SUSFS-NonGKI-Patches /tmp/susfs-nongki

          echo "[+] Making apply_patches.sh executable..."
          chmod +x /tmp/susfs-nongki/apply_patches.sh

          cd /tmp/susfs-nongki
          echo "[+] Applying patches to kernel source..." 
          set +e
          echo "y" | ./apply_patches.sh "$GITHUB_WORKSPACE"
          PATCH_STATUS=$?
          set -e
          echo "Patch helper exit status: $PATCH_STATUS"

          echo "[+] Cleaning up patch artifacts..."
          cd "$GITHUB_WORKSPACE"
          find . -name "*.rej" -delete 2>/dev/null || true
          find . -name "*.orig" -delete 2>/dev/null || true
          rm -rf /tmp/susfs-nongki
          
          echo "[+] Fixing SUSFS patch artifacts in fs/namei.c..."
          
          # Write python script to /tmp, stripping the 10-space YAML indentation
          cat << 'PYEOF' | sed 's/^          //' > /tmp/fix_namei.py
          from pathlib import Path
          import re

          path = Path("fs/namei.c")
          original = path.read_text()
          # Remove the duplicate declaration in lookup_fast().
          duplicate = re.compile( 
              r"\n#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n"
              r"\s*bool is_nd_state_lookup_last_and_open_last = "
              r"\(nd->state & ND_STATE_LOOKUP_LAST \|\| "
              r"nd->state & ND_STATE_OPEN_LAST\);\n"
              r"#endif\n",
          )
          fixed, duplicate_count = duplicate.subn("\n", original, count=1)
          # Remove the SUSFS block incorrectly inserted into sys_mknodat
          misplaced = re.compile(
              r"\n#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n"
              r"\s*if \(is_nd_flags_lookup_last && !found_sus_path && "
              r"dentry && !IS_ERR\(dentry\) && dentry->d_inode &&\n"
              r"\s*susfs_is_inode_sus_path\(dentry->d_inode\)\)\n"
              r"\s*\{\n"
              r"\s*if \(d_in_lookup\(dentry\)\)\n"
              r"\s*d_lookup_done\(dentry\);\n"
              r"\s*if \(!\(flags & LOOKUP_RCU\)\)\n"
              r"\s*dput\(dentry\);\n"
              r"\s*dentry = d_alloc_parallel\(dir, "
              r"&susfs_fake_qstr_name, &wq\);\n"
              r"\s*found_sus_path = true;\n"
              r"\s*goto retry;\n"
              r"\s*\}\n"
              r"#endif\n",
              re.MULTILINE,
          )
          fixed, misplaced_count = misplaced.subn("\n", fixed, count=1)

          if duplicate_count != 1:
              raise SystemExit(
                  f"Expected one duplicate declaration, removed {duplicate_count}"
              )
          if misplaced_count != 1:
              raise SystemExit(
                  f"Expected one misplaced mknodat block, removed {misplaced_count}"
              )

          path.write_text(fixed)
          PYEOF

          python3 /tmp/fix_namei.py
          rm -f /tmp/fix_namei.py

          test "$(grep -c 'bool is_nd_state_lookup_last_and_open_last' fs/namei.c)" -eq 1 || { echo "ERROR: duplicate declaration check failed"; exit 1; }

          if sed -n '4218,4275p' fs/namei.c | grep -Eq 'is_nd_flags_lookup_last|found_sus_path|d_alloc_parallel\(dir, &susfs_fake_qstr_name, &wq\)'; then
            echo "ERROR: invalid SUSFS code remains in sys_mknodat()"
            exit 1
          fi

          git diff --check
          echo "[+] SUSFS 2.1 + ZeroMount patches applied and verified."

      - name: Create ZeroMount Stub Header 
        run: |
          set -euo pipefail
          echo "[+] Creating stub ZeroMount header for compilation compatibility..."
          printf '#ifndef _LINUX_ZEROMOUNT_H\n#define _LINUX_ZEROMOUNT_H\n#include <linux/types.h>\nstatic inline void zeromount_spoof_mmap_metadata(struct inode *inode, dev_t *dev, unsigned long *ino) { }\nstatic inline int zeromount_is_hidden_path(const char *path) { return 0; }\nstatic inline struct filename *zeromount_getname_hook(struct filename *name) { return name; }\nstatic inline int zeromount_is_injected_file(struct inode *inode) { return 0; }\nstatic inline int zeromount_is_traversal_allowed(struct inode *inode, int mask) { return 1; }\nstatic inline int zeromount_stat_hook(struct filename *filename) { return 0; }\n#endif\n' > include/linux/zeromount.h
          echo "[+] ZeroMount stub header created at include/linux/zeromount.h"

      - name: Generate and Force Feature Defconfig
        run: |
          set -euo pipefail
          mkdir -p out
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 surya_defconfig

          echo "=== Enabling KernelSU Next Manual Hooks ==="
          ./scripts/config --file out/.config --enable CONFIG_KSU
          ./scripts/config --file out/.config --enable CONFIG_KSU_MANUAL_HOOK
          ./scripts/config --file out/.config --disable CONFIG_KSU_KPROBES_HOOK

          echo "=== Enabling SusFS 2.1 Features ==="
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_PATH
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_MOUNT
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_KSTAT
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_TRY_UMOUNT
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SPOOF_UNAME
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_ENABLE_LOG
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_OPEN_REDIRECT

          echo "=== Enabling SusFS 2.1 Enhanced Features ==="
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_KSTAT_REDIRECT
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_UNICODE_FILTER
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_HIDDEN_NAME
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_HARDENED

          echo "=== Disabling ZeroMount (stub only, no driver) ==="
          ./scripts/config --file out/.config --disable CONFIG_ZEROMOUNT
          ./scripts/config --file out/.config --disable CONFIG_KSU_SUSFS_SUS_SU

          echo "=== Enabling Other Features ==="
          ./scripts/config --file out/.config --enable CONFIG_MODULES
          ./scripts/config --file out/.config --enable CONFIG_MODULE_UNLOAD
          ./scripts/config --file out/.config --enable CONFIG_KPM
          ./scripts/config --file out/.config --enable CONFIG_EXT4_FS
          ./scripts/config --file out/.config --enable CONFIG_OVERLAY_FS
          ./scripts/config --file out/.config --enable CONFIG_PACKET

          echo "=== USB and Bluetooth as Modules ==="
          ./scripts/config --file out/.config --module CONFIG_USB_GADGET
          ./scripts/config --file out/.config --module CONFIG_USB_CONFIGFS
          ./scripts/config --file out/.config --module CONFIG_USB_LIBCOMPOSITE
          ./scripts/config --file out/.config --module CONFIG_USB_CONFIGFS_F_FS
          ./scripts/config --file out/.config --module CONFIG_USB_F_FS
          ./scripts/config --file out/.config --module CONFIG_USB_CONFIGFS_UEVENT
          ./scripts/config --file out/.config --module CONFIG_USB_CONFIGFS_RNDIS
          ./scripts/config --file out/.config --module CONFIG_USB_CONFIGFS_MASS_STORAGE
          ./scripts/config --file out/.config --module CONFIG_USB_CONFIGFS_F_HID
          ./scripts/config --file out/.config --module CONFIG_USB_F_RNDIS
          ./scripts/config --file out/.config --module CONFIG_USB_F_MASS_STORAGE
          ./scripts/config --file out/.config --module CONFIG_USB_F_HID

          ./scripts/config --file out/.config --module CONFIG_BT
          ./scripts/config --file out/.config --module CONFIG_BT_HCIBTUSB
          ./scripts/config --file out/.config --module CONFIG_BT_HCIBTUSB_BCM
          ./scripts/config --file out/.config --module CONFIG_BT_HCIBTUSB_RTL
          ./scripts/config --file out/.config --module CONFIG_BT_HCIBTUSB_MTK

          echo "=== Enabling WiFi ==="
          ./scripts/config --file out/.config --enable CONFIG_CFG80211
          ./scripts/config --file out/.config --enable CONFIG_MAC80211
          ./scripts/config --file out/.config --enable CONFIG_RTW88
          ./scripts/config --file out/.config --enable CONFIG_RTW88_CORE
          ./scripts/config --file out/.config --enable CONFIG_RTW88_USB
          ./scripts/config --file out/.config --enable CONFIG_RTW88_8812A
          ./scripts/config --file out/.config --module CONFIG_RTW88_8812AU

          echo "=== Enabling NoMount ==="
          ./scripts/config --file out/.config --enable CONFIG_NOMOUNT

          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 olddefconfig

          echo "=== Verifying Configuration ==="
          MISSING=0

          if ! grep -q "CONFIG_KSU=y" out/.config; then
            echo "FATAL: CONFIG_KSU is missing!"
            MISSING=1
          fi

          if ! grep -q "CONFIG_KSU_MANUAL_HOOK=y" out/.config; then
            echo "FATAL: CONFIG_KSU_MANUAL_HOOK is missing!"
            MISSING=1
          fi

          if ! grep -q "CONFIG_KSU_SUSFS=y" out/.config; then
            echo "FATAL: CONFIG_KSU_SUSFS is missing!"
            MISSING=1
          fi

          if [ "$MISSING" -eq 1 ]; then
            echo ""
            echo "=== Dumping relevant .config lines for debugging ==="
            grep -iE "KSU|SUSFS|ZEROMOUNT" out/.config || true
            exit 1
          fi

          echo "All dependencies verified successfully."

      - name: Build Kernel
        run: |
          set -euo pipefail
          make -j$(nproc --all) O=out ARCH=arm64 \
            KCFLAGS="-Wno-error -Wno-error=implicit-function-declaration -Wno-error=strict-prototypes -DRX_FLAG_NO_PSDU=0 -DNL80211_SCAN_FLAG_RANDOM_SN=0" \
            CC=clang LD=ld.lld AS=llvm-as AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1 \
            Image.gz dtb.img dtbo.img modules 2> >(tee log.txt >&2) || exit $?

      - name: Package AnyKernel3 ZIP
        run: |
          set -euo pipefail
          export ZIPNAME="Arise-surya-$(date '+%Y%m%d-%H%M').zip"
          head=$(git rev-parse --verify HEAD 2>/dev/null)
          if [ -n "$head" ]; then
            ZIPNAME="${ZIPNAME::-4}-$(echo $head | cut -c1-8).zip"
          fi
          kernel="out/arch/arm64/boot/Image.gz"
          dtb="out/arch/arm64/boot/dtb.img"
          dtbo="out/arch/arm64/boot/dtbo.img"
          if [ -f "$kernel" ] && [ -f "$dtb" ] && [ -f "$dtbo" ]; then
            GIT_HOST="https://github.com"
            AK3_PATH="/surya-aosp/AnyKernel3"
            if ! git clone -q "${GIT_HOST}${AK3_PATH}" -b arise AnyKernel3; then
              echo "Failed to clone AnyKernel3!"
              exit 1
            fi

            cp $kernel $dtb $dtbo AnyKernel3/

            mkdir -p AnyKernel3/system/lib/modules
            find out -name '*.ko' -exec cp {} AnyKernel3/system/lib/modules/ \;

            rtw_fw=$(find . -name 'rtw8812a_fw.bin' | head -n1)
            if [ -n "$rtw_fw" ]; then
              mkdir -p AnyKernel3/vendor/firmware/rtw88
              cp "$rtw_fw" AnyKernel3/vendor/firmware/rtw88/
            fi

            mkdir -p AnyKernel3/system/etc/init
            printf '%s\n' \
              'on boot' \
              '    insmod /system/lib/modules/rtw88_8812au.ko' \
              '' \
              'on post-fs-data' \
              '    mkdir /config/usb/g1 0770 system system' \
              '    mkdir /config/usb/g1/functions/rndis.gs4 0770 system system' \
              '    mkdir /config/usb/g1/functions/hid.usb0 0770 system system' \
              '    mkdir /config/usb/g1/functions/mass_storage.0 0770 system system' \
              '    write /config/usb/g1/os_desc/use 1' \
              > AnyKernel3/system/etc/init/arise.rc

            cd AnyKernel3
            zip -r9 "../$ZIPNAME" * -x .git README.md *placeholder
            cd ..
            echo "Completed in $((SECONDS / 60))m $((SECONDS % 60))s - Zip: $ZIPNAME"
            echo "ZIPNAME=$ZIPNAME" >> $GITHUB_ENV
          else
            echo "Compilation failed!"
            exit 1
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arise-Kernel-Surya
          path: ${{ env.ZIPNAME }}
