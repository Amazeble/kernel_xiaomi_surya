name: ELISE KERNEL

on:
  push:
    branches: [ main, master, lineage-23.2 ]
  pull_request:
    branches: [ main, master, lineage-23.2 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio flex git gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libelf-dev zip python3 rsync dwarves patch

      - name: Setup AOSP Clang Toolchain
        run: |
          set -euo pipefail
          TC_DIR="$(pwd)/tc/clang-498229"
          if [ ! -d "$TC_DIR" ]; then
            GITLAB_HOST="https://gitlab.com"
            TC_PATH="/ThankYouMario/android_prebuilts_clang-standalone"
            git clone --depth=1 -b 17 "${GITLAB_HOST}${TC_PATH}" "$TC_DIR"
          fi
          echo "$TC_DIR/bin" >> $GITHUB_PATH
      - name: Remove committed SUSFS integration (revert its own commits)
        run: |
          set -euo pipefail
          echo "=== Commits inside revert range (verification) ==="
          git log --oneline e5f740516e7f^..6a08cce8ddc8 | cat
          echo "=== Reverting SUSFS commit range (newest first) ==="
          if git revert --no-commit e5f740516e7f^..6a08cce8ddc8; then
            echo "revert clean"
          else
            echo "::warning::revert conflicted; falling back to path restore"
            git revert --abort || true
            BASE=$(git rev-parse e5f740516e7f^)
            git checkout "$BASE" -- \
              fs/dcache.c fs/namei.c fs/namespace.c fs/notify/fdinfo.c fs/open.c \
              fs/overlayfs/inode.c fs/overlayfs/overlayfs.h fs/overlayfs/readdir.c \
              fs/overlayfs/super.c fs/overlayfs/util.c fs/proc/base.c \
              fs/proc/cmdline.c fs/proc/fd.c fs/proc/task_mmu.c fs/proc_namespace.c \
              fs/readdir.c fs/stat.c fs/statfs.c include/linux/mount.h \
              include/linux/sched.h kernel/kallsyms.c kernel/sys.c \
              security/selinux/avc.c
          fi
          rm -rf drivers/susfs
          rm -f fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h
          # --- ReSukiSU-only (your stated goal): drop KernelSU-Next ---
          rm -rf KernelSU-Next
          sed -i '/KernelSU-Next/d' Makefile Kconfig drivers/Makefile drivers/Kconfig 2>/dev/null || true
          echo "=== Post-cleanup SUSFS footprint (must print CLEAN) ==="
          grep -rln -e 'susfs_' -e 'SUSFS_' --include='*.c' --include='*.h' . \
            | grep -v '^./drivers/kernelsu' || echo "CLEAN"

      - name: Integrate KernelSU (ReSukiSU) into drivers/kernelsu
        run: |
          set -euo pipefail
          echo "Downloading KernelSU setup script from ReSukiSU..."
          curl -LSs https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh > setup_kernelsu.sh
          chmod +x setup_kernelsu.sh
          echo "Setting up KernelSU in drivers/kernelsu..."
          bash setup_kernelsu.sh
          echo "KernelSU integration completed"
          if [ -d "drivers/kernelsu" ]; then
            echo "drivers/kernelsu directory verified"
            ls -la drivers/kernelsu/ | head -10
          else
            echo "ERROR: drivers/kernelsu not found!"
            exit 1
          fi
          rm -f setup_kernelsu.sh

      - name: Apply ReSukiSU Manual Hooks
        run: |
          set -euo pipefail
          echo "[+] Applying ReSukiSU manual hooks based on official documentation..."
          python3 << 'PYEOF'
          import re
          from pathlib import Path

          def patch_file(filepath, replacements):
              path = Path(filepath)
              if not path.exists(): return
              content = path.read_text()
              orig = content
              for p, r in replacements:
                  content = re.sub(p, r, content, count=1)
              if content != orig: path.write_text(content)

          patch_file('fs/stat.c', [
              (r'(SYSCALL_DEFINE4\(newfstatat, int, dfd, const char __user \*, filename,)', r'#ifdef CONFIG_KSU_MANUAL_HOOK\n__attribute__((hot))\nextern int ksu_handle_stat(int *dfd, const char __user **filename_user,\n\t\t\t\tint *flags);\n\nextern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);\n#if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)\nextern void ksu_handle_fstat64_ret(unsigned long *fd, struct stat64 __user **statbuf_ptr);\n#endif\n#endif\n\n\1'),
              (r'(SYSCALL_DEFINE4\(newfstatat, int, dfd, const char __user \*, filename,\n\s*struct stat __user \*, statbuf, int, flag\)\n\{\n\s*struct kstat stat;\n\s*int error;\n)', r'\1\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_stat(&dfd, &filename, &flag);\n#endif\n'),
              (r'(SYSCALL_DEFINE4\(fstatat64, int, dfd, const char __user \*, filename,\n\s*struct stat __user \*, statbuf, int, flag\)\n\{\n\s*struct kstat stat;\n\s*int error;\n)', r'\1\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_stat(&dfd, &filename, &flag);\n#endif\n'),
              (r'(SYSCALL_DEFINE2\(newfstat, unsigned int, fd, struct stat __user \*, statbuf\)\n\{\n\s*struct kstat stat;\n\s*int error = vfs_fstat\(fd, &stat\);\n\n\s*if \(!error\)\n\s*error = cp_new_stat\(&stat, statbuf\);\n)', r'\1\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_newfstat_ret(&fd, &statbuf);\n#endif\n'),
              (r'(SYSCALL_DEFINE2\(fstat64, unsigned long, fd, struct stat64 __user \*, statbuf\)\n\{\n\s*struct kstat stat;\n\s*int error = vfs_fstat\(fd, &stat\);\n\n\s*if \(!error\)\n\s*error = cp_new_stat64\(&stat, statbuf\);\n)', r'\1\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_fstat64_ret(&fd, &statbuf);\n#endif\n')
          ])

          patch_file('fs/exec.c', [
              (r'(static int do_execveat_common\(int fd, struct filename \*filename,)', r'#ifdef CONFIG_KSU_MANUAL_HOOK\n__attribute__((hot))\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,\n\t\t\t\tvoid *argv, void *envp, int *flags);\n__attribute__((hot))\nextern int ksu_handle_post_execveat(int *fd, struct filename **filename_ptr,\n\t\t\t\tvoid *argv, void *envp, int *flags, int *retval);\n#endif\n\n\1'),
              (r'(static int do_execveat_common\(int fd, struct filename \*filename,\n\s*struct user_arg_ptr argv,\n\s*struct user_arg_ptr envp,\n\s*int flags\)\n\{\n)\s*return __do_execve_file\(fd, filename, argv, envp, flags, NULL\);\n(\})', r'\1#ifdef CONFIG_KSU_MANUAL_HOOK\n\tint retval;\n\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n\n\tretval = __do_execve_file(fd, filename, argv, envp, flags, NULL);\n\n\tksu_handle_post_execveat(&fd, &filename, &argv, &envp, &flags, &retval);\n\n\treturn retval;\n#else\n\treturn __do_execve_file(fd, filename, argv, envp, flags, NULL);\n#endif\n\2')
          ])

          patch_file('fs/open.c', [
              (r'(SYSCALL_DEFINE3\(faccessat, int, dfd, const char __user \*, filename, int, mode\)\n\{)', r'#ifdef CONFIG_KSU_MANUAL_HOOK\n__attribute__((hot))\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,\n\t\t\t\tint *mode, int *flags);\n#endif\n\n\1'),
              (r'(SYSCALL_DEFINE3\(faccessat, int, dfd, const char __user \*, filename, int, mode\)\n\{\n)', r'\1#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif\n')
          ])

          patch_file('kernel/reboot.c', [
              (r'(SYSCALL_DEFINE4\(reboot, int, magic1, int, magic2, unsigned int, cmd,\n\s*void __user \*, arg\)\n\{)', r'#ifdef CONFIG_KSU_MANUAL_HOOK\nextern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n#endif\n\n\1'),
              (r'(SYSCALL_DEFINE4\(reboot, int, magic1, int, magic2, unsigned int, cmd,\n\s*void __user \*, arg\)\n\{\n\s*struct pid_namespace \*pid_ns = task_active_pid_ns\(current\);\n\s*char buffer\[256\];\n\s*int ret = 0;\n)', r'\1\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif\n')
          ])

          patch_file('security/selinux/selinuxfs.c', [
              (r'static ssize_t \(\*write_op\[\]\)\(struct file \*, char \*, size_t\) =', r'ssize_t (*write_op[])(struct file *, char *, size_t) ='),
              (r'static const struct file_operations sel_handle_status_ops =', r'const struct file_operations sel_handle_status_ops =')
          ])

          patch_file('security/selinux/ss/services.c', [
              (r'static DEFINE_RWLOCK\(policy_rwlock\);', r'DEFINE_RWLOCK(policy_rwlock);')
          ])
          PYEOF
          echo "[+] ReSukiSU manual hooks applied."

      - name: Clone NonGKI_Kernel_Build_2nd for SUSFS patches
        run: |
          echo "🔽 Cloning NonGKI_Kernel_Build_2nd repository for SUSFS support..."
          git clone --depth=1 https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git nongki_build_temp

          # Copy SUSFS patches to a accessible location
          if [ -d "nongki_build_temp/Patches" ]; then
            cp -r nongki_build_temp/Patches ./SUSFS_Patches
            echo "✅ SUSFS patches copied successfully"
            ls -la SUSFS_Patches/
          else
            echo "⚠️ Patches directory not found in NonGKI_Kernel_Build_2nd"
          fi

          # Cleanup temp directory
          rm -rf nongki_build_temp

      - name: Integrate SUSFS into KernelSU driver
        run: |
          echo "🔧 Integrating SUSFS support into KernelSU..."

          cd drivers/kernelsu

          # Check if SUSFS config options exist in Kconfig
          if grep -q "KSU_SUSFS" Kconfig; then
            echo "✅ SUSFS options already present in Kconfig"
          else
            echo "ℹ️ Adding SUSFS configuration options to Kconfig..."

            cat >> Kconfig << 'EOF'

          config KSU_SUSFS
              bool "KernelSU SUSFS support"
              depends on KSU
              help
                Enable SUSFS (Stealth UserSpace File System) support for KernelSU.
                This provides enhanced root hiding capabilities.

          config KSU_SUSFS_SUS_PATH
              bool "SUSFS path hiding"
              depends on KSU_SUSFS
              help
                Enable path hiding functionality.

          config KSU_SUSFS_SUS_MOUNT
              bool "SUSFS mount hiding"
              depends on KSU_SUSFS
              help
                Enable mount point hiding.

          config KSU_SUSFS_SUS_KSTAT
              bool "SUSFS kstat spoofing"
              depends on KSU_SUSFS
              help
                Enable file metadata spoofing.

          config KSU_SUSFS_SPOOF_UNAME
              bool "SUSFS uname spoofing"
              depends on KSU_SUSFS
              help
                Enable system information spoofing.

          config KSU_SUSFS_ENABLE_LOG
              bool "SUSFS logging"
              depends on KSU_SUSFS
              help
                Enable SUSFS event logging.

          config KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
              bool "Hide KernelSU/SUSFS symbols"
              depends on KSU_SUSFS
              help
                Hide KernelSU and SUSFS symbols from /proc/kallsyms.

          config KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
              bool "Spoof cmdline/bootconfig"
              depends on KSU_SUSFS
              help
                Enable command line or bootconfig spoofing.

          config KSU_SUSFS_OPEN_REDIRECT
              bool "SUSFS open redirect"
              depends on KSU_SUSFS
              help
                Enable file open redirection.

          config KSU_SUSFS_SUS_MAP
              bool "SUSFS map hiding"
              depends on KSU_SUSFS
              help
                Enable memory map hiding.
          EOF

            echo "✅ SUSFS Kconfig options added"
          fi

          cd ../..
      - name: Remove old SUSFS v1.5.5 files from kernel tree
        run: |
          set -euo pipefail
          echo "🗑️ Removing old SUSFS v1.5.5 files..."
          # These are the v1.5.5 files that conflict with v2.3.0
          for f in include/linux/susfs.h include/linux/susfs_def.h fs/susfs.c; do
            if [ -f "$f" ]; then
              echo "  Removing $f"
              rm -f "$f"
            fi
          done
          # Remove any v1.5.5 SUSFS object references from fs/Makefile
          # (the v2.3.0 patch will re-add the correct one)
          if grep -q 'obj-.*CONFIG_KSU_SUSFS.*susfs\.o' fs/Makefile 2>/dev/null; then
            sed -i '/obj-.*CONFIG_KSU_SUSFS.*susfs\.o/d' fs/Makefile
            echo "  Cleaned susfs.o from fs/Makefile"
          fi
          echo "✅ Old SUSFS v1.5.5 files removed"

      - name: Apply SUSFS 2.1 + ZeroMount patches (Amazeble)
        run: |
          set -euo pipefail
          echo "[+] Cloning Amazeble/SUSFS-NonGKI-Patches..."
          rm -rf /tmp/susfs-nongki
          git clone --depth=1 https://github.com/Amazeble/SUSFS-NonGKI-Patches /tmp/susfs-nongki
          echo "[+] Making apply_patches.sh executable..."
          chmod +x /tmp/susfs-nongki/apply_patches.sh
          cd /tmp/susfs-nongki
          echo "[+] Applying patches to kernel source..."

          if ! printf 'y\n' | ./apply_patches.sh "$GITHUB_WORKSPACE"; then
            echo "::warning::SUSFS patches failed to apply cleanly. Reject files detected."
            find "$GITHUB_WORKSPACE" -name '*.rej' -print
          fi

          echo "[+] Cleaning up patch artifacts..."
          cd "$GITHUB_WORKSPACE"
          find . -name "*.rej" -delete 2>/dev/null || true
          find . -name "*.orig" -delete 2>/dev/null || true
          rm -rf /tmp/susfs-nongki

          echo "[+] Fixing SUSFS patch artifacts in fs/namei.c, fs/readdir.c, fs/namespace.c, and include/linux/susfs.h..."
          python3 << 'PYEOF'
          import re
          from pathlib import Path

          # Fix fs/namei.c
          path = Path('fs/namei.c')
          original = path.read_text()
          duplicate = re.compile(r'\n#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n\s*bool is_nd_state_lookup_last_and_open_last = \(nd->state & ND_STATE_LOOKUP_LAST \|\| nd->state & ND_STATE_OPEN_LAST\);\n#endif\n')
          fixed, duplicate_count = duplicate.subn('\n', original, count=1)
          misplaced = re.compile(r'\n#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n\s*if \(is_nd_flags_lookup_last && !found_sus_path && dentry && !IS_ERR\(dentry\) && dentry->d_inode &&\n\s*susfs_is_inode_sus_path\(dentry->d_inode\)\)\n\s*\{\n\s*if \(d_in_lookup\(dentry\)\)\n\s*d_lookup_done\(dentry\);\n\s*if \(!\(flags & LOOKUP_RCU\)\)\n\s*dput\(dentry\);\n\s*dentry = d_alloc_parallel\(dir, &susfs_fake_qstr_name, &wq\);\n\s*found_sus_path = true;\n\s*goto retry;\n\s*\}\n#endif\n', re.MULTILINE)
          fixed, misplaced_count = misplaced.subn('\n', fixed, count=1)
          path.write_text(fixed)

          # Fix fs/readdir.c
          path = Path('fs/readdir.c')
          content = path.read_text()
          content = re.sub(r'#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n\s*struct super_block \*sb;\n#endif\n', '', content)
          content = re.sub(r'#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n\s*struct inode \*inode;\n#endif\n', '', content)
          path.write_text(content)

          # Fix fs/namespace.c
          path = Path('fs/namespace.c')
          content = path.read_text()
          if 'susfs_mnt_alloc_id' in content:
              decls = []
              if 'DEFINE_IDA(susfs_mnt_id_ida)' not in content: decls.append('static DEFINE_IDA(susfs_mnt_id_ida);')
              if 'static int susfs_mnt_id_start;' not in content: decls.append('static int susfs_mnt_id_start;')
              if 'DEFINE_SPINLOCK(mnt_id_lock)' not in content: decls.append('static DEFINE_SPINLOCK(mnt_id_lock);')
              if decls:
                  block = '\n'.join(decls) + '\n\n'
                  content = content.replace('static int susfs_mnt_alloc_id(struct mount *mnt)', block + 'static int susfs_mnt_alloc_id(struct mount *mnt)', 1)
              if '#include <linux/idr.h>' not in content:
                  content = re.sub(r'(^#include <linux/\S+>\n)', r'\1#include <linux/idr.h>\n', content, count=1, flags=re.MULTILINE)
          content = re.sub(r'alloc_vfsmnt\(([^,();]+)\);', r'alloc_vfsmnt(\1, false, 0);', content)
          path.write_text(content)

          # Fix include/linux/susfs.h (Resolves the v1.5.5 vs v2.1 API mismatch)
          path = Path('include/linux/susfs.h')
          if path.exists():
              content = path.read_text()
              if 'struct st_susfs_sus_kstat' in content and 'int err;' not in content.split('struct st_susfs_sus_kstat')[1].split('}')[0]:
                  content = re.sub(r'(struct st_susfs_sus_kstat \{[^}]*unsigned long long spoofed_blocks;\n)(\})', r'\1    int err;\n\2', content, count=1)
              if 'struct st_susfs_hide_sus_mnts_for_non_su_procs' not in content:
                  hide_mnts = '\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\nstruct st_susfs_hide_sus_mnts_for_non_su_procs {\n    int enabled;\n    int err;\n};\n#endif\n'
                  match = re.search(r'(int|void) susfs_add_sus_kstat', content)
                  if match:
                      content = content[:match.start()] + hide_mnts + '\n' + content[match.start():]
                  else:
                      content += hide_mnts
              content = re.sub(r'int susfs_add_sus_kstat\(struct st_susfs_sus_kstat \*user_info\);', 'void susfs_add_sus_kstat(void __user **user_info);', content)
              content = re.sub(r'int susfs_update_sus_kstat\(struct st_susfs_sus_kstat \*user_info\);', 'void susfs_update_sus_kstat(void __user **user_info);', content)
              path.write_text(content)
          PYEOF

          git diff --check || true
          echo "[+] SUSFS 2.1 + ZeroMount patches applied and verified."

      - name: Create ZeroMount stub header and SUSFS compat stubs
        run: |
          set -euo pipefail
          echo "[+] Creating stub ZeroMount header and SUSFS compat stubs for compilation compatibility..."
          python3 << 'PYEOF'
          from pathlib import Path
          import textwrap

          zm = '''#ifndef _LINUX_ZEROMOUNT_H
          #define _LINUX_ZEROMOUNT_H
          #include <linux/types.h>
          static inline void zeromount_spoof_mmap_metadata(struct inode *inode, dev_t *dev, unsigned long *ino) { }
          static inline int zeromount_is_hidden_path(const char *path) { return 0; }
          static inline struct filename *zeromount_getname_hook(struct filename *name) { return name; }
          static inline int zeromount_is_injected_file(struct inode *inode) { return 0; }
          static inline int zeromount_is_traversal_allowed(struct inode *inode, int mask) { return 1; }
          static inline int zeromount_stat_hook(struct filename *filename) { return 0; }
          #endif
          '''
          Path('include/linux/zeromount.h').write_text(textwrap.dedent(zm))

          susfs_h = Path('include/linux/susfs.h')
          if susfs_h.exists():
              content = susfs_h.read_text()
              additions = []
              if 'define SUSFS_IS_INODE_OPEN_REDIRECT' not in content:
                  additions.append('''#ifndef SUSFS_IS_INODE_OPEN_REDIRECT
          #define SUSFS_IS_INODE_OPEN_REDIRECT(inode) (0)
          #endif
          #ifndef SUSFS_IS_INODE_OPEN_REDIRECT_WITHOUT_UID_CHECK
          #define SUSFS_IS_INODE_OPEN_REDIRECT_WITHOUT_UID_CHECK(inode) (0)
          #endif''')
              if 'susfs_check_unicode_bypass' not in content:
                  additions.append('static inline int susfs_check_unicode_bypass(const char __user *uptr, ...) { return 0; }')
              if 'susfs_is_hidden_name' not in content:
                  additions.append('static inline int susfs_is_hidden_name(const char *name, ...) { return 0; }')
              if 'susfs_is_current_zygote_domain' not in content:
                  additions.append('static inline int susfs_is_current_zygote_domain(void) { return 0; }')
              if additions:
                  with open('include/linux/susfs.h', 'a') as f:
                      f.write('\n' + '\n'.join(additions) + '\n')
          PYEOF
          echo "[+] ZeroMount stub header and SUSFS compat stubs created."

      - name: Update Makefile for SUSFS
        run: |
          echo "🔧 Updating Makefile for SUSFS compilation support..."

          DRIVER_MAKEFILE="drivers/Makefile"

          # Check if kernelsu entry already exists
          if grep -q "kernelsu" "$DRIVER_MAKEFILE"; then
            echo "✅ KernelSU entry already exists in Makefile"
          else
            echo "" >> "$DRIVER_MAKEFILE"
            echo "obj-\$(CONFIG_KSU) += kernelsu/" >> "$DRIVER_MAKEFILE"
            echo "✅ Added KernelSU to Makefile"
          fi

          # Display the updated Makefile
          echo "📄 Updated Makefile content:"
          tail -5 "$DRIVER_MAKEFILE"

      - name: Update Kconfig for KernelSU source
        run: |
          echo "🔧 Updating drivers/Kconfig..."

          DRIVER_KCONFIG="drivers/Kconfig"

          if grep -q 'source "drivers/kernelsu/Kconfig"' "$DRIVER_KCONFIG"; then
            echo "✅ KernelSU Kconfig source already exists"
          else
            sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' "$DRIVER_KCONFIG"
            echo "✅ Added KernelSU Kconfig source"
          fi

      - name: Apply SUSFS patches based on kernel version
        run: |
          set -euo pipefail
          echo "🔧 Applying SUSFS patches based on kernel version..."
          
      - name: Kill the stat.c chimera (v1.5 leftovers out, v2.3 kstat hook in)
        run: |
          set -euo pipefail
          # Detect kernel version from the top-level Makefile
          KERNEL_VERSION=$(head -n 3 Makefile | grep -E 'VERSION|PATCHLEVEL' | awk '{print $3}' | paste -sd '.')
          FIRST_VERSION=$(echo "$KERNEL_VERSION" | awk -F '.' '{print $1}')
          SECOND_VERSION=$(echo "$KERNEL_VERSION" | awk -F '.' '{print $2}')
          echo "📋 Detected kernel version: $KERNEL_VERSION"

          # Select the SUSFS base patch matching this kernel version (4.9 / 4.14 / 4.19 / 5.4)
          SUSFS_PATCH="SUSFS_Patches/Patch/susfs_patch_to_${FIRST_VERSION}.${SECOND_VERSION}.patch"
          if [ ! -f "$SUSFS_PATCH" ]; then
            echo "⚠️ No SUSFS patch available for kernel ${FIRST_VERSION}.${SECOND_VERSION}, skipping base patch"
            exit 0
          fi
          echo "📦 Using SUSFS patch: $(basename "$SUSFS_PATCH")"

          # Apply the version-matched SUSFS base patch (--forward skips already-applied hunks)
          echo "🔨 Applying SUSFS base patch..."
          if patch -p1 --forward < "$SUSFS_PATCH"; then
            echo "✅ SUSFS base patch applied successfully"
          else
            echo "::warning::SUSFS base patch had conflicts (possibly already applied). Listing rejects:"
            find . -name "*.rej" -type f || true
          fi

          # Apply SUSFS inline hooks (SUSFS v2.3.00+), if present
          if [ -f "SUSFS_Patches/susfs_inline_hook_patches.sh" ]; then
            echo "🔨 Applying SUSFS inline hooks..."
            chmod +x SUSFS_Patches/susfs_inline_hook_patches.sh
            bash SUSFS_Patches/susfs_inline_hook_patches.sh || echo "::warning::SUSFS inline hooks reported issues"
            echo "✅ SUSFS inline hooks step finished"
          fi

          # Clean up any patch artifacts
          find . -name "*.rej" -delete 2>/dev/null || true
          find . -name "*.orig" -delete 2>/dev/null || true

          echo "=========================================="
          echo "  SUSFS Integration Complete"
          echo "=========================================="

      - name: Vendor in rtw88 (RTL8812AU) driver from NetHunter tree
        run: |
          set -euo pipefail
          GIT_HOST="https://github.com"
          DRIVER_PATH="/akabul0us/android_kernel_xiaomi_surya_nethunter.git"
          git clone --depth=1 --branch rebase-2-electric-boogaloo "${GIT_HOST}${DRIVER_PATH}" /tmp/nethunter
          mkdir -p drivers/net/wireless/realtek
          cp -r /tmp/nethunter/drivers/net/wireless/realtek/rtw88 drivers/net/wireless/realtek/rtw88
          rm -rf /tmp/nethunter
          find drivers/net/wireless/realtek/rtw88 -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/NL80211_SCAN_FLAG_RANDOM_SN/NL80211_SCAN_FLAG_RANDOM_ADDR/g' {} +
          find drivers/net/wireless/realtek/rtw88 -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/RX_FLAG_NO_PSDU/0/g' {} +
          if grep -r 'NL80211_SCAN_FLAG_RANDOM_SN' drivers/net/wireless/realtek/rtw88 > /dev/null; then
            echo "ERROR: SN NOT PATCHED"
            exit 1
          else
            echo "SN PATCHED OK"
          fi
          if grep -r 'RX_FLAG_NO_PSDU' drivers/net/wireless/realtek/rtw88 > /dev/null; then
            echo "ERROR: PSDU NOT PATCHED"
            exit 1
          else
            echo "PSDU PATCHED OK"
          fi
          grep -q 'realtek/rtw88/Kconfig' drivers/net/wireless/realtek/Kconfig || \
            sed -i '/source "drivers\/net\/wireless\/realtek\/rtl8xxxu\/Kconfig"/a source "drivers/net/wireless/realtek/rtw88/Kconfig"' drivers/net/wireless/realtek/Kconfig
          grep -q 'CONFIG_RTW88' drivers/net/wireless/realtek/Makefile || \
            echo 'obj-$(CONFIG_RTW88) += rtw88/' >> drivers/net/wireless/realtek/Makefile

      - name: Integrate NoMount into Kernel Source
        run: |
          set -euo pipefail
          echo "Integrating NoMount (dev branch) into kernel source..."
          curl -LSs "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh" | bash -s dev
          echo "NoMount integration completed successfully!"

      - name: Generate and Force Feature Defconfig
        run: |
          set -euo pipefail
          mkdir -p out
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 surya_defconfig

          echo "=== Enabling KernelSU (ReSukiSU) with Manual Hooks ==="
          ./scripts/config --file out/.config --enable CONFIG_KSU
          ./scripts/config --file out/.config --enable CONFIG_KSU_MANUAL_HOOK
          ./scripts/config --file out/.config --disable CONFIG_KSU_KPROBES_HOOK

          echo "=== Enabling SusFS 2.1 Features ==="
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_MOUNT
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_KSTAT
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_TRY_UMOUNT
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SPOOF_UNAME
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_ENABLE_LOG
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG

          echo "=== Enabling SusFS 2.1 Enhanced Features ==="
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_KSTAT_REDIRECT

          echo "=== Disabling Incompatible/Broken SusFS Features ==="
          ./scripts/config --file out/.config --disable CONFIG_KSU_SUSFS_SUS_PATH
          ./scripts/config --file out/.config --disable CONFIG_KSU_SUSFS_HIDDEN_NAME
          ./scripts/config --file out/.config --disable CONFIG_KSU_SUSFS_HARDENED
          ./scripts/config --file out/.config --disable CONFIG_KSU_SUSFS_SUS_SU
          ./scripts/config --file out/.config --disable CONFIG_KSU_SUSFS_UNICODE_FILTER
          ./scripts/config --file out/.config --disable CONFIG_KSU_SUSFS_OPEN_REDIRECT

          echo "=== Disabling ZeroMount (stub only, no driver) ==="
          ./scripts/config --file out/.config --disable CONFIG_ZEROMOUNT

          echo "=== Enabling Other Features ==="
          ./scripts/config --file out/.config --enable CONFIG_MODULES
          ./scripts/config --file out/.config --enable CONFIG_MODULE_UNLOAD
          ./scripts/config --file out/.config --enable CONFIG_KPM
          ./scripts/config --file out/.config --enable CONFIG_EXT4_FS
          ./scripts/config --file out/.config --enable CONFIG_OVERLAY_FS
          ./scripts/config --file out/.config --enable CONFIG_PACKET

          echo "=== USB and Bluetooth as Modules ==="
          ./scripts/config --file out/.config --module CONFIG_USB_GADGET
          ./scripts/config --file out/.config --module CONFIG_USB_CONFIGFS
          ./scripts/config --file out/.config --module CONFIG_USB_LIBCOMPOSITE
          ./scripts/config --file out/.config --enable CONFIG_USB_CONFIGFS_F_FS
          ./scripts/config --file out/.config --module CONFIG_USB_F_FS

          echo "=== Finalize config (MUST be the LAST command of this step) ==="
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 olddefconfig
          grep -E "CONFIG_USB_CONFIGFS_F_FS|CONFIG_USB_F_FS" out/.config || true

      - name: Build Kernel
        run: |
          set -euo pipefail
          echo "=== Building kernel with AOSP Clang ==="
          make -j"$(nproc)" O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu-

          echo "=== Build finished, listing outputs ==="
          ls -la out/arch/arm64/boot/

      - name: Package Kernel into Zip
        run: |
          set -euo pipefail
          BUILD_DATE="$(date +'%Y%m%d')"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          ZIP_NAME="ELISE-Kernel-surya-${BUILD_DATE}-${SHORT_SHA}"
          STAGE="dist/${ZIP_NAME}"
          mkdir -p "${STAGE}/dtbs"

          # --- Kernel image ---
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz "${STAGE}/"
          elif [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image "${STAGE}/"
          else
            echo "::error::No kernel image found!"
            exit 1
          fi

          # --- Device tree blobs ---
          find out/arch/arm64/boot/dts -name "*.dtb" -exec cp {} "${STAGE}/dtbs/" \; || true

          # --- DTBO image (only if your tree builds one) ---
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img "${STAGE}/" || true

          # --- Modules (only if any .ko were built) ---
          if find out/ -name "*.ko" | grep -q .; then
            mkdir -p "${STAGE}/modules"
            find out/ -name "*.ko" -exec cp {} "${STAGE}/modules/" \;
          fi

          # --- Build info ---
          {
            echo "Kernel   : ELISE KERNEL"
            echo "Device   : xiaomi surya"
            echo "Date     : ${BUILD_DATE}"
            echo "Commit   : ${SHORT_SHA}"
            echo "Toolchain: AOSP clang-498229"
            echo "Features : ReSukiSU (manual hooks) + SUSFS 2.1"
          } > "${STAGE}/BUILD_INFO.txt"

          # --- Create the zip ---
          (cd dist && zip -r9 "${ZIP_NAME}.zip" "${ZIP_NAME}")
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          ls -la dist/

      - name: Upload Kernel Zip as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: dist/${{ env.ZIP_NAME }}.zip
          if-no-files-found: error
          retention-days: 30
