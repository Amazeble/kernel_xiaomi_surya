name: Build Arise Kernel (Feature-Complete 4.14.357)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  SUSFS_BRANCH: susfs-main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio flex git gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libelf-dev zip python3 rsync dwarves

      - name: Setup AOSP Clang Toolchain
        run: |
          TC_DIR="$(pwd)/tc/clang-498229"
          if [ ! -d "$TC_DIR" ]; then
            git clone --depth=1 -b 17 https://gitlab.com/ThankYouMario/android_prebuilts_clang-standalone "$TC_DIR"
          fi
          echo "$TC_DIR/bin" >> $GITHUB_PATH

      - name: Integrate SukiSU-Ultra + SUSFS
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s ${{ env.SUSFS_BRANCH }}

      - name: Generate & Force Feature Defconfig
        run: |
          mkdir -p out
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 surya_defconfig
          ./scripts/config --file out/.config --enable CONFIG_USB_GADGET
          ./scripts/config --file out/.config --enable CONFIG_USB_CONFIGFS
          ./scripts/config --file out/.config --enable CONFIG_USB_LIBCOMPOSITE
          ./scripts/config --file out/.config --enable CONFIG_USB_CONFIGFS_F_FS
          ./scripts/config --file out/.config --enable CONFIG_USB_F_FS
          ./scripts/config --file out/.config --enable CONFIG_USB_CONFIGFS_UEVENT
          ./scripts/config --file out/.config --enable CONFIG_USB_CONFIGFS_RNDIS
          ./scripts/config --file out/.config --enable CONFIG_USB_CONFIGFS_MASS_STORAGE
          ./scripts/config --file out/.config --enable CONFIG_USB_CONFIGFS_F_HID
          ./scripts/config --file out/.config --enable CONFIG_USB_F_RNDIS
          ./scripts/config --file out/.config --enable CONFIG_USB_F_MASS_STORAGE
          ./scripts/config --file out/.config --enable CONFIG_USB_F_HID
          ./scripts/config --file out/.config --enable CONFIG_BT
          ./scripts/config --file out/.config --enable CONFIG_BT_HCIBTUSB
          ./scripts/config --file out/.config --enable CONFIG_BT_HCIBTUSB_BCM
          ./scripts/config --file out/.config --enable CONFIG_BT_HCIBTUSB_RTL
          ./scripts/config --file out/.config --enable CONFIG_BT_HCIBTUSB_MTK
          ./scripts/config --file out/.config --enable CONFIG_CFG80211
          ./scripts/config --file out/.config --enable CONFIG_MAC80211
          ./scripts/config --file out/.config --disable CONFIG_MODULE_SIG
          ./scripts/config --file out/.config --disable CONFIG_MODULE_SIG_FORCE
          ./scripts/config --file out/.config --disable CONFIG_MODULE_SIG_ALL
          ./scripts/config --file out/.config --disable CONFIG_MODVERSIONS
          ./scripts/config --file out/.config --disable CONFIG_LTO
          ./scripts/config --file out/.config --disable CONFIG_LTO_CLANG
          ./scripts/config --file out/.config --disable CONFIG_CFI_CLANG
          ./scripts/config --file out/.config --disable CONFIG_DEBUG_INFO_BTF
          ./scripts/config --file out/.config --disable CONFIG_WERROR
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 olddefconfig

      - name: Build Kernel
        run: |
          make -j$(nproc --all) O=out ARCH=arm64 KCFLAGS="-Wno-error -Wno-error=implicit-function-declaration -Wno-error=strict-prototypes" CC=clang LD=ld.lld AS=llvm-as AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1 Image.gz dtb.img dtbo.img 2> >(tee log.txt >&2) || exit $?

      - name: Build RTL8812AU Driver (lwfinger/rtw88)
        run: |
          make O=out ARCH=arm64 CC=clang LD=ld.lld AS=llvm-as AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1 modules_prepare
          git clone https://github.com/lwfinger/rtw88.git
          cd rtw88
          make ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 KSRC="${GITHUB_WORKSPACE}/out" KCFLAGS="-D__nonstring= -Wno-error -Wno-error=implicit-function-declaration -Wno-error=strict-prototypes -Wno-unused-function"
          mkdir -p "${GITHUB_WORKSPACE}/compiled_modules"
          cp *.ko "${GITHUB_WORKSPACE}/compiled_modules/"
          mkdir -p "${GITHUB_WORKSPACE}/compiled_firmware"
          cp firmware/*.bin "${GITHUB_WORKSPACE}/compiled_firmware/"
          cd ..

      - name: Package AnyKernel3 ZIP
        run: |
          export ZIPNAME="Arise-surya-$(date '+%Y%m%d-%H%M').zip"
          head=$(git rev-parse --verify HEAD 2>/dev/null)
          if [ -n "$head" ]; then
            ZIPNAME="${ZIPNAME::-4}-$(echo $head | cut -c1-8).zip"
          fi
          kernel="out/arch/arm64/boot/Image.gz"
          dtb="out/arch/arm64/boot/dtb.img"
          dtbo="out/arch/arm64/boot/dtbo.img"
          if [ -f "$kernel" ] && [ -f "$dtb" ] && [ -f "$dtbo" ]; then
            if ! git clone -q https://github.com/surya-aosp/AnyKernel3 -b arise; then
              echo "Failed to clone AnyKernel3!"
              exit 1
            fi
            cp $kernel $dtb $dtbo AnyKernel3
            if [ -d "compiled_modules" ]; then
              mkdir -p AnyKernel3/system/lib/modules
              cp compiled_modules/*.ko AnyKernel3/system/lib/modules/
            fi
            if [ -d "compiled_firmware" ]; then
              mkdir -p AnyKernel3/vendor/firmware/rtw88
              cp compiled_firmware/*.bin AnyKernel3/vendor/firmware/rtw88/
            fi
            mkdir -p AnyKernel3/system/etc/init
            printf '%s\n' \
              'on boot' \
              '    insmod /system/lib/modules/rtw_core.ko' \
              '    insmod /system/lib/modules/rtw_usb.ko' \
              '    insmod /system/lib/modules/rtw_88xxa.ko' \
              '    insmod /system/lib/modules/rtw_8812a.ko' \
              '    insmod /system/lib/modules/rtw_8812au.ko' \
              '' \
              'on post-fs-data' \
              '    mkdir /config/usb/g1 0770 system system' \
              '    mkdir /config/usb/g1/functions/rndis.gs4 0770 system system' \
              '    mkdir /config/usb/g1/functions/hid.usb0 0770 system system' \
              '    mkdir /config/usb/g1/functions/mass_storage.0 0770 system system' \
              '    write /config/usb/g1/os_desc/use 1' \
              > AnyKernel3/system/etc/init/arise.rc
            rm -rf out/arch/arm64/boot
            cd AnyKernel3
            zip -r9 "../$ZIPNAME" * -x .git README.md *placeholder
            cd ..
            echo "Completed in $((SECONDS / 60))m $((SECONDS % 60))s - Zip: $ZIPNAME"
            echo "ZIPNAME=$ZIPNAME" >> $GITHUB_ENV
          else
            echo "Compilation failed!"
            exit 1
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIPNAME }}
          path: ${{ env.ZIPNAME }}
