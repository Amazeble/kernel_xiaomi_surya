name: Hotfix Workflow URLs

on:
  workflow_dispatch: # Allows manual trigger from Actions tab

jobs:
  fix_urls_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Hotfix Script Workflow URLs
        run: |
          echo "[+] Automatically correcting placeholder URLs..."
          
          # Target this exact file to fix its own URLs
          WORKFLOW_FILE=".github/workflows/Fix_url.yml"
          
          # Short-line paths to prevent layout cropping
          KSU_NEXT_SCRIPT="https://githubusercontent.com"\
          "rifsxd/KernelSU-Next/next/kernel/setup.sh"
          
          KSU_NEXT_REPO="https://github.com"\
          "pershoot/KernelSU-Next.git"
          
          SUSFS_REPO="https://gitlab.com"\
          "simonpunk/susfs4ksu.git"
          
          if [ -f "$WORKFLOW_FILE" ]; then
            # 1. Fix the broken GitHub User Content curl link
            sed -i "s|https://githubusercontent.com|${KSU_NEXT_SCRIPT}|g" \
              "$WORKFLOW_FILE"
            
            # 2. Fix the broken git remote trailing quote and empty URL
            sed -i "s|git remote add next-susfs https://github.com\"|git remote add next-susfs \"${KSU_NEXT_REPO}\"|g" \
              "$WORKFLOW_FILE"
            
            # 3. Fix the placeholder GitLab URL for the SusFS sources
            SRC_MATCH="git clone https://gitlab.com -b kernel-4.14 susfs_source"
            SRC_REPLACE="git clone ${SUSFS_REPO} -b kernel-4.14 susfs_source"
            sed -i "s|${SRC_MATCH}|${SRC_REPLACE}|g" \
              "$WORKFLOW_FILE"
            
            echo "[+] URLs successfully updated inline inside $WORKFLOW_FILE"
          else
            echo "[!] Target workflow file not found."
            exit 1
          fi

      - name: Commit and Push Changes
        run: |
          git config --global user.email "amazeble@gma8l.com"
          git config --global user.name "Amazeble"
          git config set advice.addIgnoredFile false
          git add .github/workflows/Fix_url.yml
          git diff-index --quiet HEAD || git commit -m "chore: hotfix repository URLs"
          git push
